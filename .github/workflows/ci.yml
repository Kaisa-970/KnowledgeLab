name: Verify KnowledgeLab
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (lockfile-pinned)
        run: npm ci --no-audit --no-fund
      - name: Validate Agent skill registry
        run: node scripts/check-agent-skills.mjs
      - name: Validate course contracts
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and validator tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for interaction tests
        run: npx playwright install --with-deps chromium
      - name: Browser interaction and mobile smoke tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
